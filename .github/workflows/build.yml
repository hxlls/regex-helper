name: Build Windows & Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Get packages
        run: flutter pub get
      - name: Test
        run: flutter test
      - name: Build Windows exe
        run: flutter build windows --release
      - name: Package exe
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dest = "regex-helper-windows"
          Copy-Item -Recurse $src $dest
          Compress-Archive -Path $dest -DestinationPath "regex-helper-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: regex-helper-windows
          path: regex-helper-windows.zip

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get packages
        run: flutter pub get
      - name: Test
        run: flutter test
      - name: Pre-download Gradle (avoid intermittent GitHub 503)
        run: |
          cd android
          GRADLE_URL="https://services.gradle.org/distributions/gradle-8.14.2-all.zip"
          for i in 1 2 3 4 5; do
            if curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
                -o "$HOME/gradle-8.14.2-all.zip" "$GRADLE_URL"; then
              echo "Gradle downloaded on attempt $i"
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          test -f "$HOME/gradle-8.14.2-all.zip"
          sed -i "s|^distributionUrl=.*|distributionUrl=file://$HOME/gradle-8.14.2-all.zip|" \
            gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk regex-helper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: regex-helper-android
          path: regex-helper.apk

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: regex-helper-windows
          path: dist/
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: regex-helper-android
          path: dist/
      - name: Rename assets with version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mv dist/regex-helper-windows.zip "dist/regex-helper-windows-${VER}.zip"
          mv dist/regex-helper.apk "dist/regex-helper-${VER}.apk"
          ls -la dist/
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: true
